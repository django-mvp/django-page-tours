{% extends "base.html" %}
{% block content %}
  <h1 id="library-book-title">A book about tours</h1>
  <p>A short book about guiding a visitor through a page.</p>
  <form method="post" action="{% url 'library-borrow' %}">
    {% csrf_token %}
    <button id="library-borrow" type="submit">Borrow</button>
  </form>
  {% if request.session.borrowed %}<p>You have borrowed this book. The checklist has ticked it.</p>{% endif %}
  {{ tour }}
{% endblock content %}
